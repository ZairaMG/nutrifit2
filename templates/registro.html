
{% extends "base.html" %}

{% block title %}Crear cuenta | NutriFit{% endblock %}

{% block auth_content %}

<div class="auth-card">

    <!-- LOGOTIPO -->

    <div class="auth-logo">

        <div class="logo-icon">
            🥑
        </div>

        <h1>NutriFit</h1>

        <p>
            Sistema de gestión nutricional
        </p>

    </div>


    <!-- TÍTULO -->

    <h2>Crear una cuenta</h2>

    <p class="subtitle">
        Regístrate para comenzar a administrar tu consultorio.
    </p>


    <!-- FORMULARIO -->

    <form method="POST" action="{{ url_for('registro') }}">

        <!-- NOMBRE -->

        <div class="form-group">

            <label for="nombre">
                Nombre completo
            </label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Escribe tu nombre completo"
                required
                maxlength="100"
                autocomplete="name"
                value="{{ request.form.get('nombre', '') }}"
            >

        </div>


        <!-- CORREO -->

        <div class="form-group">

            <label for="email">
                Correo electrónico
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="ejemplo@correo.com"
                required
                autocomplete="email"
                value="{{ request.form.get('email', '') }}"
            >

        </div>


        <!-- CONTRASEÑA -->

        <div class="form-group">

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Mínimo 8 caracteres"
                minlength="8"
                required
                autocomplete="new-password"
            >

        </div>


        <!-- CONFIRMAR CONTRASEÑA -->

        <div class="form-group">

            <label for="confirm_password">
                Confirmar contraseña
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Repite tu contraseña"
                minlength="8"
                required
                autocomplete="new-password"
            >

        </div>


        <!-- BOTÓN -->

        <button type="submit" class="btn">

            Crear mi cuenta

        </button>

    </form>


    <!-- REGRESAR AL LOGIN -->

    <div class="auth-footer">

        ¿Ya tienes una cuenta?

        <a href="{{ url_for('login') }}">
            Iniciar sesión
        </a>

    </div>

</div>

{% endblock %}
