
{% extends "base.html" %}

{% block title %}Iniciar sesión | NutriFit{% endblock %}

{% block auth_content %}

<div class="auth-card">

    <!-- LOGOTIPO -->

    <div class="auth-logo">

        <div class="logo-icon">
            🥑
        </div>

        <h1>NutriFit</h1>

        <p>
            Sistema de gestión nutricional
        </p>

    </div>


    <!-- TÍTULO -->

    <h2>¡Bienvenido de nuevo!</h2>

    <p class="subtitle">
        Ingresa tus datos para acceder a tu cuenta.
    </p>


    <!-- FORMULARIO DE LOGIN -->

    <form method="POST" action="{{ url_for('login') }}">

        <div class="form-group">

            <label for="email">
                Correo electrónico
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="ejemplo@correo.com"
                required
                autocomplete="email"
            >

        </div>


        <div class="form-group">

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingresa tu contraseña"
                required
                autocomplete="current-password"
            >

        </div>


        <!-- BOTÓN -->

        <button type="submit" class="btn">

            Iniciar sesión

        </button>

    </form>


    <!-- REGISTRO -->

    <div class="auth-footer">

        ¿Todavía no tienes una cuenta?

        <a href="{{ url_for('registro') }}">
            Crear cuenta
        </a>

    </div>

</div>

{% endblock %}
